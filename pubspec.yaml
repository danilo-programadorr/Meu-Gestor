name: meu_gestor_financeiro
description: Fundação Android do aplicativo Meu Gestor Financeiro.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  cloud_firestore: ^6.7.1
  firebase_auth: ^6.5.6
  firebase_core: ^4.12.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  google_sign_in: ^7.2.0
  in_app_purchase: 3.3.0
  intl: ^0.20.2
  shared_preferences: 2.5.5
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/auth/auth_hero.webp
